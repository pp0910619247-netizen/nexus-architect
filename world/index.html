<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NEXUS WORLD — Manhattan on Island</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
 *{margin:0;padding:0;box-sizing:border-box} body{overflow:hidden;background:#020810;font-family:'Space Grotesk',system-ui}
 #loader{position:fixed;inset:0;background:#020810;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:99;transition:opacity .6s}
 #loader h1{font-size:26px;letter-spacing:4px;color:#fff;font-weight:700} #loader h1 span{color:#F59E0B}
 #loader p{color:#6B7280;font-size:11px;margin-top:8px;letter-spacing:2px}
 #bar{width:220px;height:2px;background:#0f1a2e;border-radius:2px;margin-top:18px;overflow:hidden}
 #bar i{display:block;height:100%;width:0%;background:linear-gradient(90deg,#F59E0B,#EF4444);transition:width .2s}
 #top{position:fixed;top:0;left:0;right:0;height:56px;background:rgba(6,12,24,.88);backdrop-filter:blur(16px);border-bottom:1px solid rgba(255,255,255,.06);display:flex;align-items:center;justify-content:space-between;padding:0 18px;z-index:10}
 #brand{font-weight:700;letter-spacing:3px;color:#fff;font-size:14px} #brand span{color:#F59E0B} #brand small{font-weight:400;letter-spacing:1px;color:#6B7280;font-size:10px;margin-left:8px}
 #topRight{display:flex;align-items:center;gap:12px;font-size:11px;color:#9CA3AF}
 .pill{background:rgba(245,158,11,.12);border:1px solid rgba(245,158,11,.22);color:#FDE68A;border-radius:20px;padding:5px 10px;font-family:'JetBrains Mono',monospace}
 .live{width:7px;height:7px;background:#10B981;border-radius:50%;display:inline-block;animation:pulse 1.8s infinite}
 @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
 #districts{position:fixed;top:66px;left:50%;transform:translateX(-50%);display:flex;gap:7px;z-index:10;flex-wrap:wrap;justify-content:center}
 #districts button{background:rgba(16,24,40,.9);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.08);color:#9CA3AF;border-radius:24px;padding:7px 13px;font-size:11px;font-weight:600;cursor:pointer;transition:.2s}
 #districts button.active{background:#F59E0B;color:#0A0A0F;border-color:#F59E0B;box-shadow:0 4px 18px rgba(245,158,11,.35)}
 #chat{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);display:flex;gap:8px;background:rgba(10,14,24,.92);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.08);border-radius:28px;padding:8px;z-index:10;box-shadow:0 12px 40px rgba(0,0,0,.5)}
 #chat input{width:340px;background:rgba(255,255,255,.06);border:none;border-radius:20px;padding:11px 18px;color:#fff;outline:none;font-size:14px}
 #chat input::placeholder{color:#6B7280}
 #chat button{background:linear-gradient(135deg,#F59E0B,#EF4444);border:none;border-radius:20px;padding:11px 20px;color:#fff;font-weight:700;cursor:pointer}
 #hint{position:fixed;bottom:16px;left:16px;background:rgba(10,14,24,.85);border:1px solid rgba(255,255,255,.06);border-radius:12px;padding:10px 12px;color:#6B7280;font-size:11px;line-height:1.6;z-index:10}
 kbd{background:#1a2744;border:1px solid #2a3a5a;border-bottom-width:2px;border-radius:4px;padding:1px 5px;font-family:'JetBrains Mono',monospace;font-size:10px;color:#E5E7EB}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
<div id="loader"><h1><span>NEXUS</span> MANHATTAN</h1><p>NYC OPEN DATA · ON ISLAND</p><div id="bar"><i id="prog"></i></div></div>
<div id="top">
  <div id="brand"><span>NEXUS</span> MANHATTAN <small>NYC DATA · ISLAND CITY</small></div>
  <div id="topRight">
    <span class="pill"><span class="live"></span> <span id="bCount">0</span> BUILDINGS</span>
    <span class="pill" style="border-color:rgba(6,182,214,.25);color:#67E8F9"><span id="aCount">0</span> AI</span>
    <span class="pill"><span id="fps">60</span> FPS</span>
  </div>
</div>
<div id="districts">
  <button class="active" onclick="gotoDistrict(0)">🗽 Downtown</button>
  <button onclick="gotoDistrict(1)">🏙️ Midtown</button>
  <button onclick="gotoDistrict(2)">🌳 Central Park</button>
  <button onclick="gotoDistrict(3)">🕊️ Memorial</button>
</div>
<div id="chat"><input id="msg" placeholder="พิมพ์คุยกับ AI ใน Manhattan..."><button onclick="sendChat()">ส่ง ➤</button></div>
<div id="hint"><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> เดิน · <kbd>Shift</kbd> วิ่ง · ลากหมุน<br>Manhattan 210×70m บนเกาะ · Central Park กลางเกาะ</div>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
import {UnrealBloomPass} from 'three/addons/postprocessing/UnrealBloomPass.js';

const progEl=document.getElementById('prog'); function setProg(v){ progEl.style.width=v+'%'; if(v>=100) setTimeout(()=>{ document.getElementById('loader').style.opacity='0'; setTimeout(()=>document.getElementById('loader').remove(),500)},350)}
setProg(10);

const scene=new THREE.Scene(); scene.background=new THREE.Color(0x020810); scene.fog=new THREE.FogExp2(0x020810,0.013);
const camera=new THREE.PerspectiveCamera(68,innerWidth/innerHeight,0.1,900); camera.position.set(42,28,48);
const renderer=new THREE.WebGLRenderer({antialias:true, powerPreference:'high-performance'});
renderer.setSize(innerWidth,innerHeight); renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1.35; renderer.outputColorSpace=THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);
setProg(28);

const composer=new EffectComposer(renderer);
composer.addPass(new RenderPass(scene,camera));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),0.48,0.35,0.85));

const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,0,0); controls.enableDamping=true; controls.dampingFactor=0.055;
controls.maxPolarAngle=Math.PI/2.02; controls.minDistance=8; controls.maxDistance=180;
setProg(42);

scene.add(new THREE.HemisphereLight(0x8aa0ff,0x020810,0.62));
const sun=new THREE.DirectionalLight(0xfff0dd,1.7); sun.position.set(70,65,35); sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048); sun.shadow.camera.near=2; sun.shadow.camera.far=320;
sun.shadow.camera.left=-140; sun.shadow.camera.right=140; sun.shadow.camera.top=90; sun.shadow.camera.bottom=-90;
scene.add(sun);
scene.add(new THREE.PointLight(0xF59E0B,80,70).translateX(-35).translateY(10));
scene.add(new THREE.PointLight(0x8B5CF6,70,60).translateX(35).translateY(8).translateZ(10));
setProg(52);

// OCEAN
const ocean=new THREE.Mesh(new THREE.PlaneGeometry(700,700,64,64), new THREE.MeshStandardMaterial({color:0x0a2a4a, roughness:0.18, metalness:0.08, transparent:true, opacity:0.96}));
ocean.rotation.x=-Math.PI/2; ocean.position.y=-0.7; scene.add(ocean);
const foam=new THREE.Mesh(new THREE.RingGeometry(115,128,64), new THREE.MeshBasicMaterial({color:0x38BDF8, transparent:true, opacity:0.16, side:THREE.DoubleSide}));
foam.rotation.x=-Math.PI/2; foam.position.y=-0.5; foam.scale.set(1.6,0.6,1); scene.add(foam);

// ISLAND — Manhattan shape (long narrow 220x75)
const island=new THREE.Mesh(new THREE.PlaneGeometry(230,82), new THREE.MeshStandardMaterial({color:0x0e1a2e, roughness:0.9}));
island.rotation.x=-Math.PI/2; island.position.y=0.15; island.receiveShadow=true; scene.add(island);
const beach=new THREE.Mesh(new THREE.PlaneGeometry(240,92), new THREE.MeshStandardMaterial({color:0xC2B280, roughness:1}));
beach.rotation.x=-Math.PI/2; beach.position.y=0.08; scene.add(beach);
const edge=new THREE.Mesh(new THREE.RingGeometry(95,97,64), new THREE.MeshBasicMaterial({color:0x1e3a5f, side:THREE.DoubleSide}));
edge.rotation.x=Math.PI/2; edge.position.y=-0.25; edge.scale.set(1.2,0.42,1); scene.add(edge);

// ROADS — Manhattan grid (avenues vertical, streets horizontal)
for(let x=-105;x<=105;x+=14){
  const r=new THREE.Mesh(new THREE.PlaneGeometry(220,1.6), new THREE.MeshStandardMaterial({color:0x1a233a}));
  r.rotation.x=-Math.PI/2; r.position.set(x,0.35,0); scene.add(r);
}
for(let z=-32;z<=32;z+=10){
  const r=new THREE.Mesh(new THREE.PlaneGeometry(1.6,82), new THREE.MeshStandardMaterial({color:0x1a233a}));
  r.rotation.x=-Math.PI/2; r.position.set(0,0.35,z); scene.add(r);
  const line=new THREE.Mesh(new THREE.PlaneGeometry(220,0.14), new THREE.MeshBasicMaterial({color:0xFACC15}));
  line.rotation.x=-Math.PI/2; line.position.set(0,0.36,z); scene.add(line);
}
setProg(68);

// Central Park — green rectangle center
const park=new THREE.Mesh(new THREE.PlaneGeometry(48,28), new THREE.MeshStandardMaterial({color:0x14532d, roughness:0.9}));
park.rotation.x=-Math.PI/2; park.position.set(8,0.4,0); park.receiveShadow=true; scene.add(park);
const parkBorder=new THREE.Mesh(new THREE.PlaneGeometry(50,30), new THREE.MeshBasicMaterial({color:0x0f3d1f}));
parkBorder.rotation.x=-Math.PI/2; parkBorder.position.set(8,0.38,0); scene.add(parkBorder);
// park label
const cvP=document.createElement('canvas'); cvP.width=280; cvP.height=50;
const ctxP=cvP.getContext('2d'); ctxP.fillStyle='rgba(20,83,45,0.85)'; ctxP.beginPath(); ctxP.roundRect(0,0,280,50,10); ctxP.fill();
ctxP.fillStyle='#fff'; ctxP.font='700 14px Space Grotesk'; ctxP.textAlign='center'; ctxP.fillText('🌳 CENTRAL PARK',140,30);
const parkSpr=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(cvP)})); parkSpr.position.set(8,6,0); parkSpr.scale.set(14,2.5,1); scene.add(parkSpr);

setProg(78);

// BUILDINGS — NYC heights based on zone (real-ish)
// Data source: NYC Open Data building heights — approximated
let bc=0;
function addB(x,z,w,d,h,hex){
  if(Math.abs(x)>108 || Math.abs(z)>36) return;
  // skip Central Park
  if(x> -12 && x<28 && Math.abs(z)<13) return;
  if(Math.hypot(x*0.5,z)>95) return; // keep inside island
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d), new THREE.MeshStandardMaterial({color:hex, roughness:0.58, metalness:0.15}));
  m.position.set(x,h/2+0.3,z); m.castShadow=true; m.receiveShadow=true; scene.add(m); bc++;
  for(let y=1;y<h-1;y+=2.1){
    if(Math.random()>0.52) continue;
    const glow=new THREE.Color().setHSL(0.58+Math.random()*0.12,0.65,0.58);
    const win=new THREE.Mesh(new THREE.PlaneGeometry(w*0.5,0.42), new THREE.MeshBasicMaterial({color:glow, transparent:true, opacity:0.7}));
    win.position.set(x,y+0.9,z+d/2+0.02); scene.add(win);
    const win2=win.clone(); win2.position.set(x,y+0.9,z-d/2-0.02); win2.rotation.y=Math.PI; scene.add(win2);
  }
  if(h>18){
    const ant=new THREE.Mesh(new THREE.BoxGeometry(0.12,2.5,0.12), new THREE.MeshBasicMaterial({color:0xEF4444}));
    ant.position.set(x,h+1.5,z); scene.add(ant);
    const topL=new THREE.PointLight(hex,18,12); topL.position.set(x,h+0.8,z); scene.add(topL);
  }
}
// Generate Manhattan grid
for(let x=-100;x<=100;x+=11){
  for(let z=-30;z<=30;z+=9){
    if(Math.random()>0.82) continue;
    if(x>-12 && x<28 && Math.abs(z)<13) continue; // park gap
    // height by zone — Midtown tallest (x around 5), Downtown tall (x around -65), else medium
    let h;
    const midDist=Math.abs(x-5), downDist=Math.abs(x+62);
    if(midDist<18) h=14+Math.random()*20; // Midtown 14-34
    else if(downDist<16) h=12+Math.random()*16; // Downtown 12-28
    else h=4+Math.random()*10;
    // add variance
    if(Math.random()<0.08) h+=8; // occasional supertall
    const w=3.2+Math.random()*2.8, d=3.2+Math.random()*2.8;
    const col=new THREE.Color().setHSL(0.6+Math.random()*0.06, 0.12, 0.22+Math.random()*0.14);
    // warm tint for downtown
    if(downDist<16) col.offsetHSL(0.05,0.1,0.05);
    addB(x+(Math.random()-0.5)*3, z+(Math.random()-0.5)*2.5, w,d,h, col.getHex());
  }
}
// Landmarks
// One World Trade — Downtown
addB(-68,0,6,6,32,0x334155);
// Empire State — Midtown
addB(2,4,5,5,30,0x475569);
// Chrysler
addB(12,-6,4,4,26,0x64748b);
// Central Park Tower
addB(6,16,4,4,28,0x334155);

document.getElementById('bCount').textContent=bc;
setProg(90);

// Nexus Tower — center near park south
const tower=new THREE.Mesh(new THREE.CylinderGeometry(2.0,3.0,26,8), new THREE.MeshStandardMaterial({color:0xF59E0B, emissive:0x7c2d12, emissiveIntensity:0.55, roughness:0.4}));
tower.position.set(-2,13.3,18); tower.castShadow=true; scene.add(tower);
const beacon=new THREE.Mesh(new THREE.SphereGeometry(1.3,20,20), new THREE.MeshBasicMaterial({color:0xffffff}));
beacon.position.set(-2,27.5,18); scene.add(beacon);
const beaconL=new THREE.PointLight(0xF59E0B,140,90); beaconL.position.copy(beacon.position); scene.add(beaconL);

const districts=[
  {name:'Downtown', center:new THREE.Vector3(-62,0,0), color:0xEF4444},
  {name:'Midtown', center:new THREE.Vector3(5,0,0), color:0x8B5CF6},
  {name:'Central Park', center:new THREE.Vector3(8,0,0), color:0x10B981},
  {name:'Memorial', center:new THREE.Vector3(42,0,18), color:0x06B6D4},
];
districts.forEach(d=>{
  const torus=new THREE.Mesh(new THREE.TorusGeometry(2.2,0.18,14,28), new THREE.MeshBasicMaterial({color:d.color, transparent:true, opacity:0.88}));
  torus.position.copy(d.center).add(new THREE.Vector3(0,2.2,0)); scene.add(torus);
  const cv=document.createElement('canvas'); cv.width=300; cv.height=70;
  const ctx=cv.getContext('2d'); ctx.fillStyle='rgba(0,0,0,0.58)'; ctx.beginPath(); ctx.roundRect(0,0,300,70,14); ctx.fill();
  ctx.fillStyle='#fff'; ctx.font='700 18px Space Grotesk'; ctx.textAlign='center'; ctx.fillText(d.name,150,30);
  ctx.fillStyle='#9CA3AF'; ctx.font='11px JetBrains Mono'; ctx.fillText('ENTER →',150,50);
  const spr=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(cv)})); spr.position.copy(d.center).add(new THREE.Vector3(0,8,0)); spr.scale.set(11,2.6,1); scene.add(spr);
});
setProg(94);

// avatars
function makeAvatar(hex, human=false){
  const g=new THREE.Group();
  const body=new THREE.Mesh(new THREE.CapsuleGeometry(0.32,0.66,4,12), new THREE.MeshStandardMaterial({color:hex, roughness:0.5}));
  body.position.y=1.18; body.castShadow=true; g.add(body);
  const head=new THREE.Mesh(new THREE.SphereGeometry(0.26,14,14), new THREE.MeshStandardMaterial({color: human?0xFDE68A:0xEDE9FE}));
  head.position.y=1.81; head.castShadow=true; g.add(head);
  if(!human){
    const ring=new THREE.Mesh(new THREE.RingGeometry(0.46,0.54,18), new THREE.MeshBasicMaterial({color:hex, side:THREE.DoubleSide, transparent:true, opacity:0.5}));
    ring.rotation.x=Math.PI/2; ring.position.y=2.31; g.add(ring);
  }
  return g;
}
const human=makeAvatar(0x3B82F6,true); human.position.set(0,0.3,10); scene.add(human);
const crowd=[], targets=[];
for(let i=0;i<40;i++){
  const col=[0x8B5CF6,0xEC4899,0x06B6D4,0x10B981,0xF59E0B][i%5];
  const a=makeAvatar(col,false);
  const rx=(Math.random()-0.5)*180, rz=(Math.random()-0.5)*55;
  a.position.set(rx,0.3,rz);
  // keep inside island & not in park
  if(a.position.length()>95 || (a.position.x>-12 && a.position.x<28 && Math.abs(a.position.z)<13)) a.position.set((Math.random()-0.5)*80,0.3,(Math.random()-0.5)*30);
  scene.add(a); crowd.push(a);
  let t=new THREE.Vector3((Math.random()-0.5)*160,0.3,(Math.random()-0.5)*50);
  if(t.length()>90) t.multiplyScalar(90/t.length());
  targets.push(t);
}
document.getElementById('aCount').textContent=crowd.length+1;
setProg(100);

const keys={}; addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true);
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
let sprint=false; addEventListener('keydown',e=>{if(e.key==='Shift') sprint=true}); addEventListener('keyup',e=>{if(e.key==='Shift') sprint=false});
function updateHuman(dt){
  const s=(sprint?6.5:3.4)*dt; let dx=0,dz=0;
  if(keys['w']) dz-=s; if(keys['s']) dz+=s; if(keys['a']) dx-=s; if(keys['d']) dx+=s;
  if(dx||dz){
    const fwd=new THREE.Vector3(); camera.getWorldDirection(fwd); fwd.y=0; fwd.normalize();
    const right=new THREE.Vector3().crossVectors(fwd,new THREE.Vector3(0,1,0)).negate();
    const np=human.position.clone().addScaledVector(fwd,-dz).addScaledVector(right,-dx);
    if(Math.abs(np.x)<105 && Math.abs(np.z)<38 && !(np.x>-12 && np.x<28 && Math.abs(np.z)<13)){ human.position.copy(np); human.position.y=0.3; human.lookAt(human.position.x+dx,0.3,human.position.z+dz); controls.target.lerp(human.position,0.05); }
  }
}
function updateCrowd(dt){
  crowd.forEach((a,i)=>{
    const t=targets[i]; const d=new THREE.Vector3().subVectors(t,a.position); d.y=0;
    if(d.length()<1.8){ let nt=new THREE.Vector3((Math.random()-0.5)*160,0.3,(Math.random()-0.5)*50); if(nt.length()>92) nt.multiplyScalar(92/nt.length()); if(nt.x>-12 && nt.x<28 && Math.abs(nt.z)<13) nt.x+=35; t.copy(nt); }
    else { d.normalize().multiplyScalar(1.15*dt); const np=a.position.clone().add(d); if(Math.abs(np.x)<105 && Math.abs(np.z)<38 && !(np.x>-12 && np.x<28 && Math.abs(np.z)<13)){ a.position.add(d); a.lookAt(t.x,0.3,t.z);} else { t.set((Math.random()-0.5)*100,0.3,(Math.random()-0.5)*30);} }
    a.position.y=0.3+Math.sin(performance.now()*0.0014 + i)*0.03;
  });
}
window.gotoDistrict=i=>{
  document.querySelectorAll('#districts button').forEach((b,idx)=> b.classList.toggle('active', idx===i));
  const p=districts[i].center.clone(); p.y=0.3;
  human.position.copy(p).add(new THREE.Vector3(3,0,3)); controls.target.copy(human.position);
  camera.position.copy(human.position).add(new THREE.Vector3(18,16,18));
};
window.sendChat=()=>{
  const v=document.getElementById('msg').value.trim(); if(!v) return;
  document.getElementById('msg').value='';
  let best=crowd[0], bd=1e9; crowd.forEach(a=>{ const d=a.position.distanceTo(human.position); if(d<bd){bd=d; best=a;}});
  if(best) targets[crowd.indexOf(best)].copy(human.position).add(new THREE.Vector3((Math.random()-0.5)*3,0,(Math.random()-0.5)*3));
};
let last=performance.now(), frames=0, lastFps=performance.now();
function animate(){
  requestAnimationFrame(animate);
  const now=performance.now(), dt=Math.min(0.033,(now-last)/1000); last=now;
  const pos=ocean.geometry.attributes.position;
  for(let i=0;i<pos.count;i++){
    const x=pos.getX(i), y=pos.getY(i); const d=Math.hypot(x,y);
    if(d>130) pos.setZ(i, Math.sin(d*0.04 - now*0.0007)*0.7 + Math.cos(x*0.03+now*0.0005)*0.35);
  }
  pos.needsUpdate=true; ocean.geometry.computeVertexNormals();
  updateHuman(dt); updateCrowd(dt);
  beaconL.intensity=120+Math.sin(now*0.0025)*25;
  controls.update(); composer.render();
  frames++; if(now-lastFps>500){ document.getElementById('fps').textContent=Math.round(frames*1000/(now-lastFps)); frames=0; lastFps=now; }
}
animate();
addEventListener('resize',()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); composer.setSize(innerWidth,innerHeight);});
</script>
</body>
</html>
