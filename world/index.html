<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NEXUS WORLD — Island City · Professional</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
 *{margin:0;padding:0;box-sizing:border-box} body{overflow:hidden;background:#020810;font-family:'Space Grotesk',system-ui}
 #loader{position:fixed;inset:0;background:#020810;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:99;transition:opacity .6s}
 #loader h1{font-size:28px;letter-spacing:4px;color:#fff;font-weight:700} #loader h1 span{color:#6366F1}
 #loader p{color:#6B7280;font-size:12px;margin-top:8px;letter-spacing:2px}
 #bar{width:220px;height:2px;background:#0f1a2e;border-radius:2px;margin-top:18px;overflow:hidden}
 #bar i{display:block;height:100%;width:0%;background:linear-gradient(90deg,#6366F1,#06B6D4);transition:width .2s}
 #top{position:fixed;top:0;left:0;right:0;height:56px;background:rgba(6,12,24,.85);backdrop-filter:blur(16px);border-bottom:1px solid rgba(255,255,255,.06);display:flex;align-items:center;justify-content:space-between;padding:0 18px;z-index:10}
 #brand{font-weight:700;letter-spacing:3px;color:#fff;font-size:15px} #brand span{color:#6366F1} #brand small{font-weight:400;letter-spacing:1px;color:#6B7280;font-size:10px;margin-left:8px}
 #topRight{display:flex;align-items:center;gap:12px;font-size:11px;color:#9CA3AF}
 .pill{background:rgba(99,102,241,.12);border:1px solid rgba(99,102,241,.2);color:#A5B4FC;border-radius:20px;padding:5px 10px;font-family:'JetBrains Mono',monospace}
 .live{width:7px;height:7px;background:#10B981;border-radius:50%;display:inline-block;animation:pulse 1.8s infinite}
 @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
 #districts{position:fixed;top:66px;left:50%;transform:translateX(-50%);display:flex;gap:8px;z-index:10}
 #districts button{background:rgba(16,24,40,.9);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.08);color:#9CA3AF;border-radius:24px;padding:8px 14px;font-size:12px;font-weight:600;cursor:pointer;transition:.2s}
 #districts button.active{background:#fff;color:#0A0A0F;border-color:#fff;box-shadow:0 4px 18px rgba(255,255,255,.2)}
 #chat{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);display:flex;gap:8px;background:rgba(10,14,24,.92);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.08);border-radius:28px;padding:8px;z-index:10;box-shadow:0 12px 40px rgba(0,0,0,.5)}
 #chat input{width:360px;background:rgba(255,255,255,.06);border:none;border-radius:20px;padding:11px 18px;color:#fff;outline:none;font-size:14px}
 #chat input::placeholder{color:#6B7280}
 #chat button{background:linear-gradient(135deg,#6366F1,#06B6D4);border:none;border-radius:20px;padding:11px 20px;color:#fff;font-weight:700;cursor:pointer}
 #hint{position:fixed;bottom:16px;left:16px;background:rgba(10,14,24,.85);border:1px solid rgba(255,255,255,.06);border-radius:12px;padding:10px 12px;color:#6B7280;font-size:11px;line-height:1.6;z-index:10}
 kbd{background:#1a2744;border:1px solid #2a3a5a;border-bottom-width:2px;border-radius:4px;padding:1px 5px;font-family:'JetBrains Mono',monospace;font-size:10px;color:#E5E7EB}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
<div id="loader"><h1><span>NEXUS</span> ISLAND</h1><p>LOADING ISLAND CITY</p><div id="bar"><i id="prog"></i></div></div>
<div id="top">
  <div id="brand"><span>NEXUS</span> ISLAND <small>PROFESSIONAL · ISLAND CITY</small></div>
  <div id="topRight">
    <span class="pill"><span class="live"></span> <span id="bCount">0</span> BUILDINGS</span>
    <span class="pill" style="border-color:rgba(6,182,214,.25);color:#67E8F9"><span id="aCount">0</span> AI</span>
    <span class="pill" style="border-color:rgba(16,185,129,.2);color:#6EE7B7"><span id="fps">60</span> FPS</span>
  </div>
</div>
<div id="districts">
  <button class="active" onclick="gotoDistrict(0)">🏙️ Downtown</button>
  <button onclick="gotoDistrict(1)">🤖 Twin District</button>
  <button onclick="gotoDistrict(2)">🛠️ Creator Zone</button>
  <button onclick="gotoDistrict(3)">🕊️ Memorial</button>
</div>
<div id="chat"><input id="msg" placeholder="พิมพ์คุยกับ AI บนเกาะ..."><button onclick="sendChat()">ส่ง ➤</button></div>
<div id="hint"><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> เดิน · <kbd>Shift</kbd> วิ่ง · ลากหมุน · Scroll ซูม<br>เกาะ 220×220m · 170 ตึก · 40 AI · ล้อมทะเล</div>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
import {UnrealBloomPass} from 'three/addons/postprocessing/UnrealBloomPass.js';

let prog=0; const progEl=document.getElementById('prog');
function setProg(v){ progEl.style.width=v+'%'; if(v>=100) setTimeout(()=>{ document.getElementById('loader').style.opacity='0'; setTimeout(()=>document.getElementById('loader').remove(),600)},350)}
setProg(12);

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x020810);
scene.fog=new THREE.FogExp2(0x020810,0.012);
const camera=new THREE.PerspectiveCamera(68,innerWidth/innerHeight,0.1,900);
camera.position.set(30,26,38);
const renderer=new THREE.WebGLRenderer({antialias:true, powerPreference:'high-performance'});
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1.35;
renderer.outputColorSpace=THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);
setProg(28);

const composer=new EffectComposer(renderer);
composer.addPass(new RenderPass(scene,camera));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),0.5,0.35,0.85));

const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,0,0); controls.enableDamping=true; controls.dampingFactor=0.055;
controls.maxPolarAngle=Math.PI/2.02; controls.minDistance=8; controls.maxDistance=160;
setProg(42);

// lights — island sunset
scene.add(new THREE.HemisphereLight(0x8aa0ff,0x020810,0.65));
const sun=new THREE.DirectionalLight(0xfff0dd,1.6); sun.position.set(60,55,30); sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048); sun.shadow.camera.near=2; sun.shadow.camera.far=260;
sun.shadow.camera.left=-130; sun.shadow.camera.right=130; sun.shadow.camera.top=130; sun.shadow.camera.bottom=-130;
scene.add(sun);
const p1=new THREE.PointLight(0x6366F1,90,70); p1.position.set(-28,10,0); scene.add(p1);
const p2=new THREE.PointLight(0x06B6D4,70,60); p2.position.set(30,8,20); scene.add(p2);
setProg(55);

// OCEAN — huge water plane with gentle wave
const oceanGeo=new THREE.PlaneGeometry(600,600,64,64);
const oceanMat=new THREE.MeshStandardMaterial({color:0x0a2a4a, roughness:0.2, metalness:0.1, transparent:true, opacity:0.95});
const ocean=new THREE.Mesh(oceanGeo, oceanMat);
ocean.rotation.x=-Math.PI/2; ocean.position.y=-0.6; scene.add(ocean);
// foam ring around island
const foam=new THREE.Mesh(new THREE.RingGeometry(108,122,64), new THREE.MeshBasicMaterial({color:0x38BDF8, transparent:true, opacity:0.18, side:THREE.DoubleSide}));
foam.rotation.x=-Math.PI/2; foam.position.y=-0.4; scene.add(foam);

// ISLAND — elevated ground + beach
const islandGeo=new THREE.CircleGeometry(110,64);
const islandMat=new THREE.MeshStandardMaterial({color:0x0e1a2e, roughness:0.9});
const island=new THREE.Mesh(islandGeo, islandMat);
island.rotation.x=-Math.PI/2; island.position.y=0.15; island.receiveShadow=true; scene.add(island);
// beach ring
const beach=new THREE.Mesh(new THREE.RingGeometry(98,112,64), new THREE.MeshStandardMaterial({color:0xC2B280, roughness:1}));
beach.rotation.x=-Math.PI/2; beach.position.y=0.1; beach.receiveShadow=true; scene.add(beach);
// island edge wall
const edge=new THREE.Mesh(new THREE.TorusGeometry(110,0.9,12,64), new THREE.MeshStandardMaterial({color:0x1e3a5f}));
edge.rotation.x=Math.PI/2; edge.position.y=-0.2; scene.add(edge);

// roads — island grid
for(let i=-90;i<=90;i+=20){
  const mk=(w,h,c)=>{ const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h), new THREE.MeshStandardMaterial({color:c})); m.rotation.x=-Math.PI/2; m.position.y=0.35; return m; };
  if(Math.abs(i)>95) continue;
  const r1=mk(200,2.0,0x1a233a); r1.position.z=i; scene.add(r1);
  const r2=mk(2.0,200,0x1a233a); r2.position.x=i; scene.add(r2);
  const l1=new THREE.Mesh(new THREE.PlaneGeometry(200,0.16), new THREE.MeshBasicMaterial({color:0xFACC15})); l1.rotation.x=-Math.PI/2; l1.position.set(0,0.36,i); scene.add(l1);
  const l2=new THREE.Mesh(new THREE.PlaneGeometry(0.16,200), new THREE.MeshBasicMaterial({color:0xFACC15})); l2.rotation.x=-Math.PI/2; l2.position.set(i,0.36,0); scene.add(l2);
}
setProg(70);

// city — 170 buildings on island only (radius < 92)
const districts=[
  {name:'Downtown', center:new THREE.Vector3(-38,0,-38), color:0x3B82F6},
  {name:'Twin District', center:new THREE.Vector3(38,0,-38), color:0x8B5CF6},
  {name:'Creator Zone', center:new THREE.Vector3(-38,0,38), color:0xF59E0B},
  {name:'Memorial', center:new THREE.Vector3(38,0,38), color:0x10B981},
];
let bc=0;
function addBuilding(x,z,w,d,h,hex){
  if(Math.hypot(x,z)>92) return;
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d), new THREE.MeshStandardMaterial({color:hex, roughness:0.6, metalness:0.12}));
  m.position.set(x,h/2+0.3,z); m.castShadow=true; m.receiveShadow=true; scene.add(m); bc++;
  for(let y=1;y<h-1;y+=2.2){
    if(Math.random()>0.55) continue;
    const glow=new THREE.Color().setHSL(0.62+Math.random()*0.08,0.7,0.6);
    const win=new THREE.Mesh(new THREE.PlaneGeometry(w*0.55,0.45), new THREE.MeshBasicMaterial({color:glow, transparent:true, opacity:0.72}));
    win.position.set(x,y+0.9,z+d/2+0.02); scene.add(win);
    const win2=win.clone(); win2.position.set(x,y+0.9,z-d/2-0.02); win2.rotation.y=Math.PI; scene.add(win2);
  }
  const top=new THREE.Mesh(new THREE.BoxGeometry(w*0.28,0.45,d*0.28), new THREE.MeshBasicMaterial({color:0x6366F1}));
  top.position.set(x,h+0.52,z); scene.add(top);
}
for(let x=-85;x<=85;x+=13){
  for(let z=-85;z<=85;z+=13){
    if(Math.abs(x)<9 && Math.abs(z)<9) continue;
    if(Math.hypot(x,z)>88) continue;
    if(Math.random()>0.78) continue;
    const h=4+Math.random()*15 + (Math.hypot(x,z)>55? Math.random()*6:0);
    const w=4+Math.random()*3.2, d=4+Math.random()*3.2;
    const near=districts.reduce((a,b)=> a.center.distanceTo(new THREE.Vector3(x,0,z)) < b.center.distanceTo(new THREE.Vector3(x,0,z)) ? a:b);
    const c=new THREE.Color(near.color); c.offsetHSL(0,-0.35,0.14+Math.random()*0.16);
    addBuilding(x+(Math.random()-0.5)*3.5, z+(Math.random()-0.5)*3.5, w,d,h, c.getHex());
  }
}
document.getElementById('bCount').textContent=bc;
setProg(86);

// Nexus Tower — center island
const tower=new THREE.Mesh(new THREE.CylinderGeometry(2.4,3.4,28,8), new THREE.MeshStandardMaterial({color:0x6366F1, emissive:0x1e1b4b, emissiveIntensity:0.7, roughness:0.4}));
tower.position.set(0,14.3,0); tower.castShadow=true; scene.add(tower);
const beacon=new THREE.Mesh(new THREE.SphereGeometry(1.5,20,20), new THREE.MeshBasicMaterial({color:0xffffff}));
beacon.position.set(0,29,0); scene.add(beacon);
const beaconL=new THREE.PointLight(0x6366F1,150,95); beaconL.position.copy(beacon.position); scene.add(beaconL);
districts.forEach(d=>{
  const torus=new THREE.Mesh(new THREE.TorusGeometry(2.4,0.2,14,28), new THREE.MeshBasicMaterial({color:d.color, transparent:true, opacity:0.9}));
  torus.position.copy(d.center).add(new THREE.Vector3(0,2.4,0)); scene.add(torus);
  const cv=document.createElement('canvas'); cv.width=300; cv.height=70;
  const ctx=cv.getContext('2d'); ctx.fillStyle='rgba(0,0,0,0.58)'; ctx.beginPath(); ctx.roundRect(0,0,300,70,14); ctx.fill();
  ctx.fillStyle='#fff'; ctx.font='700 18px Space Grotesk'; ctx.textAlign='center'; ctx.fillText(d.name,150,30);
  ctx.fillStyle='#9CA3AF'; ctx.font='11px JetBrains Mono'; ctx.fillText('ENTER →',150,50);
  const spr=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(cv)})); spr.position.copy(d.center).add(new THREE.Vector3(0,8,0)); spr.scale.set(12,2.8,1); scene.add(spr);
});
setProg(93);

// avatars
function makeAvatar(hex, human=false){
  const g=new THREE.Group();
  const body=new THREE.Mesh(new THREE.CapsuleGeometry(0.33,0.68,4,12), new THREE.MeshStandardMaterial({color:hex, roughness:0.5}));
  body.position.y=1.18; body.castShadow=true; g.add(body);
  const head=new THREE.Mesh(new THREE.SphereGeometry(0.27,14,14), new THREE.MeshStandardMaterial({color: human?0xFDE68A:0xEDE9FE}));
  head.position.y=1.82; head.castShadow=true; g.add(head);
  if(!human){
    const ring=new THREE.Mesh(new THREE.RingGeometry(0.48,0.56,18), new THREE.MeshBasicMaterial({color:hex, side:THREE.DoubleSide, transparent:true, opacity:0.55}));
    ring.rotation.x=Math.PI/2; ring.position.y=2.32; g.add(ring);
  }
  return g;
}
const human=makeAvatar(0x3B82F6,true); human.position.set(0,0.3,8); scene.add(human);
const crowd=[], targets=[];
for(let i=0;i<40;i++){
  const col=[0x8B5CF6,0xEC4899,0x06B6D4,0x10B981,0xF59E0B][i%5];
  const a=makeAvatar(col,false);
  const ang=Math.random()*Math.PI*2, r=12+Math.random()*68;
  a.position.set(Math.cos(ang)*r,0.3,Math.sin(ang)*r);
  if(a.position.length()>88) a.position.multiplyScalar(88/a.position.length());
  scene.add(a); crowd.push(a);
  let t=new THREE.Vector3((Math.random()-0.5)*90,0.3,(Math.random()-0.5)*90);
  if(t.length()>85) t.multiplyScalar(85/t.length());
  targets.push(t);
}
document.getElementById('aCount').textContent=crowd.length+1;
setProg(100);

// controls
const keys={}; addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true);
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
let sprint=false; addEventListener('keydown',e=>{if(e.key==='Shift') sprint=true}); addEventListener('keyup',e=>{if(e.key==='Shift') sprint=false});
function updateHuman(dt){
  const s=(sprint?6.5:3.4)*dt; let dx=0,dz=0;
  if(keys['w']) dz-=s; if(keys['s']) dz+=s; if(keys['a']) dx-=s; if(keys['d']) dx+=s;
  if(dx||dz){
    const fwd=new THREE.Vector3(); camera.getWorldDirection(fwd); fwd.y=0; fwd.normalize();
    const right=new THREE.Vector3().crossVectors(fwd,new THREE.Vector3(0,1,0)).negate();
    const np=human.position.clone().addScaledVector(fwd,-dz).addScaledVector(right,-dx);
    if(np.length()<90){ human.position.copy(np); human.position.y=0.3; human.lookAt(human.position.x+dx,0.3,human.position.z+dz); controls.target.lerp(human.position,0.05); }
  }
}
function updateCrowd(dt){
  crowd.forEach((a,i)=>{
    const t=targets[i]; const d=new THREE.Vector3().subVectors(t,a.position); d.y=0;
    if(d.length()<1.8){ let nt=new THREE.Vector3((Math.random()-0.5)*90,0.3,(Math.random()-0.5)*90); if(nt.length()>85) nt.multiplyScalar(85/nt.length()); t.copy(nt); }
    else { d.normalize().multiplyScalar(1.15*dt); const np=a.position.clone().add(d); if(np.length()<90){ a.position.add(d); a.lookAt(t.x,0.3,t.z);} else { t.set((Math.random()-0.5)*50,0.3,(Math.random()-0.5)*50);} }
    a.position.y=0.3+Math.sin(performance.now()*0.0014 + i)*0.03;
  });
}
window.gotoDistrict=i=>{
  document.querySelectorAll('#districts button').forEach((b,idx)=> b.classList.toggle('active', idx===i));
  const p=districts[i].center.clone(); p.y=0.3;
  human.position.copy(p).add(new THREE.Vector3(3,0,3)); controls.target.copy(human.position);
  camera.position.copy(human.position).add(new THREE.Vector3(20,18,20));
};
window.sendChat=()=>{
  const v=document.getElementById('msg').value.trim(); if(!v) return;
  document.getElementById('msg').value='';
  let best=crowd[0], bd=1e9; crowd.forEach(a=>{ const d=a.position.distanceTo(human.position); if(d<bd){bd=d; best=a;}});
  if(best) targets[crowd.indexOf(best)].copy(human.position).add(new THREE.Vector3((Math.random()-0.5)*3,0,(Math.random()-0.5)*3));
};

let last=performance.now(), frames=0, lastFps=performance.now();
function animate(){
  requestAnimationFrame(animate);
  const now=performance.now(), dt=Math.min(0.033,(now-last)/1000); last=now;
  // ocean wave
  const pos=ocean.geometry.attributes.position;
  for(let i=0;i<pos.count;i++){
    const x=pos.getX(i), y=pos.getY(i);
    const d=Math.hypot(x,y);
    if(d>125) pos.setZ(i, Math.sin(d*0.04 - now*0.0007)*0.6 + Math.cos(x*0.03+now*0.0005)*0.3);
  }
  pos.needsUpdate=true; ocean.geometry.computeVertexNormals();
  updateHuman(dt); updateCrowd(dt);
  beaconL.intensity=120+Math.sin(now*0.0025)*25;
  controls.update(); composer.render();
  frames++; if(now-lastFps>500){ document.getElementById('fps').textContent=Math.round(frames*1000/(now-lastFps)); frames=0; lastFps=now; }
}
animate();
addEventListener('resize',()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); composer.setSize(innerWidth,innerHeight);});
</script>
</body>
</html>
