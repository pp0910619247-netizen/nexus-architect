<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NEXUS WORLD — Grand City · Professional</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
 *{margin:0;padding:0;box-sizing:border-box} body{overflow:hidden;background:#050510;font-family:'Space Grotesk',system-ui}
 #loader{position:fixed;inset:0;background:#050510;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:99;transition:opacity .6s}
 #loader h1{font-size:28px;letter-spacing:4px;color:#fff;font-weight:700} #loader h1 span{color:#6366F1}
 #loader p{color:#6B7280;font-size:12px;margin-top:8px;letter-spacing:2px}
 #bar{width:220px;height:2px;background:#1E1E2E;border-radius:2px;margin-top:18px;overflow:hidden}
 #bar i{display:block;height:100%;width:0%;background:linear-gradient(90deg,#6366F1,#8B5CF6);transition:width .2s}
 /* top bar — pro */
 #top{position:fixed;top:0;left:0;right:0;height:56px;background:rgba(8,8,14,.82);backdrop-filter:blur(16px) saturate(1.2);border-bottom:1px solid rgba(255,255,255,.06);display:flex;align-items:center;justify-content:space-between;padding:0 18px;z-index:10}
 #brand{font-weight:700;letter-spacing:3px;color:#fff;font-size:15px} #brand span{color:#6366F1} #brand small{font-weight:400;letter-spacing:1px;color:#6B7280;font-size:10px;margin-left:8px}
 #topRight{display:flex;align-items:center;gap:14px;font-size:11px;color:#9CA3AF}
 .pill{background:rgba(99,102,241,.12);border:1px solid rgba(99,102,241,.2);color:#A5B4FC;border-radius:20px;padding:5px 10px;font-family:'JetBrains Mono',monospace}
 .live{width:7px;height:7px;background:#10B981;border-radius:50%;display:inline-block;animation:pulse 1.8s infinite}
 @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
 /* districts */
 #districts{position:fixed;top:66px;left:50%;transform:translateX(-50%);display:flex;gap:8px;z-index:10}
 #districts button{pointer-events:auto;background:rgba(22,22,32,.9);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.08);color:#9CA3AF;border-radius:24px;padding:8px 14px;font-size:12px;font-weight:600;cursor:pointer;transition:.2s}
 #districts button.active{background:#fff;color:#0A0A0F;border-color:#fff;box-shadow:0 4px 18px rgba(255,255,255,.2)}
 /* chat */
 #chat{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);display:flex;gap:8px;background:rgba(14,14,22,.92);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.08);border-radius:28px;padding:8px;z-index:10;box-shadow:0 12px 40px rgba(0,0,0,.5)}
 #chat input{width:360px;background:rgba(255,255,255,.06);border:none;border-radius:20px;padding:11px 18px;color:#fff;outline:none;font-size:14px}
 #chat input::placeholder{color:#6B7280}
 #chat button{background:linear-gradient(135deg,#6366F1,#8B5CF6);border:none;border-radius:20px;padding:11px 20px;color:#fff;font-weight:700;cursor:pointer;letter-spacing:.5px}
 #hint{position:fixed;bottom:16px;left:16px;background:rgba(14,14,22,.85);border:1px solid rgba(255,255,255,.06);border-radius:12px;padding:10px 12px;color:#6B7280;font-size:11px;line-height:1.6;z-index:10}
 kbd{background:#1E1E2E;border:1px solid #2A2A3A;border-bottom-width:2px;border-radius:4px;padding:1px 5px;font-family:'JetBrains Mono',monospace;font-size:10px;color:#E5E7EB}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
<div id="loader"><h1><span>NEXUS</span> WORLD</h1><p>LOADING GRAND CITY</p><div id="bar"><i id="prog"></i></div></div>
<div id="top">
  <div id="brand"><span>NEXUS</span> WORLD <small>PROFESSIONAL · MOVIE-SCALE METAVERSE</small></div>
  <div id="topRight">
    <span class="pill"><span class="live"></span> <span id="bCount">0</span> BUILDINGS</span>
    <span class="pill" style="border-color:rgba(139,92,246,.25);color:#C4B5FD"><span id="aCount">0</span> AI CITIZENS</span>
    <span class="pill" style="border-color:rgba(16,185,129,.2);color:#6EE7B7"><span id="fps">60</span> FPS</span>
    <span style="color:#6B7280;font-family:'JetBrains Mono',monospace;font-size:10px">Polygon · Mesh P2P</span>
  </div>
</div>
<div id="districts">
  <button class="active" onclick="gotoDistrict(0)">🏙️ Downtown</button>
  <button onclick="gotoDistrict(1)">🤖 Twin District</button>
  <button onclick="gotoDistrict(2)">🛠️ Creator Zone</button>
  <button onclick="gotoDistrict(3)">🕊️ Memorial</button>
  <button onclick="toggleEarth()" id="earthBtn">🌍 Google Earth</button>
</div>
<div id="chat"><input id="msg" placeholder="พิมพ์คุยกับ AI ทั้งเมือง..."><button onclick="sendChat()">ส่ง ➤</button></div>
<div id="hint"><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> เดิน · <kbd>Shift</kbd> วิ่ง · ลากเมาส์หมุน · Scroll ซูม<br>เมือง 260×260m · 180 ตึก neon · คลิกเขตเพื่อวาร์ป</div>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
import {UnrealBloomPass} from 'three/addons/postprocessing/UnrealBloomPass.js';
import {initGoogleEarth, updateEarth} from './google-earth.js';

let prog=0; const progEl=document.getElementById('prog');
function setProg(v){ prog=v; progEl.style.width=v+'%'; if(v>=100) setTimeout(()=>{ document.getElementById('loader').style.opacity='0'; setTimeout(()=>document.getElementById('loader').remove(),600)},400)}
setProg(10);

// scene
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x050510);
scene.fog=new THREE.FogExp2(0x050510,0.011);
const camera=new THREE.PerspectiveCamera(68,innerWidth/innerHeight,0.1,900);
camera.position.set(32,24,36);
const renderer=new THREE.WebGLRenderer({antialias:true, powerPreference:'high-performance'});
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1.35;
renderer.outputColorSpace=THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);
setProg(25);

// post — bloom pro
const composer=new EffectComposer(renderer);
composer.addPass(new RenderPass(scene,camera));
const bloom=new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),0.55,0.4,0.85);
composer.addPass(bloom);

// Google Earth — ใส่ key ที่ localStorage.gmaps_key หรือแก้ตรงนี้
const GMAPS_KEY = localStorage.getItem('gmaps_key') || 'YOUR_API_KEY';
let earthTiles = initGoogleEarth(scene,camera,renderer, GMAPS_KEY);
let earthOn = false;
window.toggleEarth = ()=>{
  if(GMAPS_KEY==='YOUR_API_KEY'){
    const k=prompt('ใส่ Google Maps API Key (เปิด Map Tiles API แล้ว):\nขอที่ console.cloud.google.com/apis/library/tile.googleapis.com\n(ว่างไว้ = ใช้ลูกโลก fallback)');
    if(k){ localStorage.setItem('gmaps_key',k); location.reload(); }
    else { // fallback globe already added
      earthOn=!earthOn; document.getElementById('earthBtn').classList.toggle('active',earthOn);
    }
    return;
  }
  earthOn=!earthOn; document.getElementById('earthBtn').classList.toggle('active',earthOn);
  if(earthTiles) earthTiles.group.visible=earthOn;
};

const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,0,0); controls.enableDamping=true; controls.dampingFactor=0.055;
controls.maxPolarAngle=Math.PI/2.03; controls.minDistance=6; controls.maxDistance=140;
setProg(40);

// lights — cinematic night
scene.add(new THREE.HemisphereLight(0x8a90ff,0x050510,0.55));
const moon=new THREE.DirectionalLight(0xffffff,1.7); moon.position.set(50,70,30); moon.castShadow=true;
moon.shadow.mapSize.set(2048,2048); moon.shadow.camera.near=2; moon.shadow.camera.far=180;
moon.shadow.camera.left=-100; moon.shadow.camera.right=100; moon.shadow.camera.top=100; moon.shadow.camera.bottom=-100;
scene.add(moon);
const p1=new THREE.PointLight(0x6366F1,120,70); p1.position.set(-30,10,0); scene.add(p1);
const p2=new THREE.PointLight(0xEC4899,90,60); p2.position.set(28,8,22); scene.add(p2);
const p3=new THREE.PointLight(0x10B981,70,50); p3.position.set(0,6,-28); scene.add(p3);
setProg(55);

// ground — PBR
const ground=new THREE.Mesh(new THREE.PlaneGeometry(300,300), new THREE.MeshStandardMaterial({color:0x0e0e1e, roughness:0.92, metalness:0.05}));
ground.rotation.x=-Math.PI/2; ground.receiveShadow=true; scene.add(ground);
// roads
for(let i=-120;i<=120;i+=20){
  const mk=(w,h,c)=>{ const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h), new THREE.MeshStandardMaterial({color:c})); m.rotation.x=-Math.PI/2; m.position.y=0.02; return m; };
  const r1=mk(300,2.2,0x17172a); r1.position.z=i; scene.add(r1);
  const r2=mk(2.2,300,0x17172a); r2.position.x=i; scene.add(r2);
  const l1=new THREE.Mesh(new THREE.PlaneGeometry(300,0.18), new THREE.MeshBasicMaterial({color:0xFACC15})); l1.rotation.x=-Math.PI/2; l1.position.set(0,0.03,i); scene.add(l1);
  const l2=new THREE.Mesh(new THREE.PlaneGeometry(0.18,300), new THREE.MeshBasicMaterial({color:0xFACC15})); l2.rotation.x=-Math.PI/2; l2.position.set(i,0.03,0); scene.add(l2);
}
setProg(70);

// city — 180 buildings PBR + emissive windows
const districts=[
  {name:'Downtown', center:new THREE.Vector3(-42,0,-42), color:0x3B82F6},
  {name:'Twin District', center:new THREE.Vector3(42,0,-42), color:0x8B5CF6},
  {name:'Creator Zone', center:new THREE.Vector3(-42,0,42), color:0xF59E0B},
  {name:'Memorial', center:new THREE.Vector3(42,0,42), color:0x10B981},
];
let bc=0;
function addBuilding(x,z,w,d,h,hex){
  const mat=new THREE.MeshStandardMaterial({color:hex, roughness:0.65, metalness:0.15});
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat);
  m.position.set(x,h/2,z); m.castShadow=true; m.receiveShadow=true; scene.add(m); bc++;
  const winH=Math.floor(h/1.15);
  for(let y=1;y<winH;y+=2.2){
    if(Math.random()>0.55) continue;
    const glow=new THREE.Color().setHSL(0.62+Math.random()*0.08,0.7,0.6);
    const winMat=new THREE.MeshBasicMaterial({color:glow, transparent:true, opacity:0.75});
    const w1=new THREE.Mesh(new THREE.PlaneGeometry(w*0.55,0.45), winMat); w1.position.set(x,y+0.6,z+d/2+0.02); scene.add(w1);
    const w2=w1.clone(); w2.position.set(x,y+0.6,z-d/2-0.02); w2.rotation.y=Math.PI; scene.add(w2);
  }
  const top=new THREE.Mesh(new THREE.BoxGeometry(w*0.28,0.5,d*0.28), new THREE.MeshBasicMaterial({color:0x6366F1}));
  top.position.set(x,h+0.25,z); scene.add(top);
}
for(let x=-110;x<=110;x+=13){
  for(let z=-110;z<=110;z+=13){
    if(Math.abs(x)<10 && Math.abs(z)<10) continue;
    if(Math.random()>0.78) continue;
    const h=4+Math.random()*16 + (Math.hypot(x,z)>60? Math.random()*8:0);
    const w=4+Math.random()*3.2, d=4+Math.random()*3.2;
    const near=districts.reduce((a,b)=> a.center.distanceTo(new THREE.Vector3(x,0,z)) < b.center.distanceTo(new THREE.Vector3(x,0,z)) ? a:b);
    const c=new THREE.Color(near.color); c.offsetHSL(0,-0.35,0.12+Math.random()*0.18);
    addBuilding(x+(Math.random()-0.5)*4, z+(Math.random()-0.5)*4, w,d,h, c.getHex());
  }
}
document.getElementById('bCount').textContent=bc;
setProg(85);

// plaza — Nexus Tower pro
const tower=new THREE.Mesh(new THREE.CylinderGeometry(2.2,3.2,26,8), new THREE.MeshStandardMaterial({color:0x6366F1, emissive:0x1e1b4b, emissiveIntensity:0.7, roughness:0.4}));
tower.position.set(0,13,0); tower.castShadow=true; scene.add(tower);
const beacon=new THREE.Mesh(new THREE.SphereGeometry(1.4,20,20), new THREE.MeshBasicMaterial({color:0xffffff}));
beacon.position.set(0,27,0); scene.add(beacon);
const beaconL=new THREE.PointLight(0x6366F1,140,90); beaconL.position.copy(beacon.position); scene.add(beaconL);
// portals + labels
districts.forEach((d,i)=>{
  const torus=new THREE.Mesh(new THREE.TorusGeometry(2.4,0.2,14,28), new THREE.MeshBasicMaterial({color:d.color, transparent:true, opacity:0.9}));
  torus.position.copy(d.center).add(new THREE.Vector3(0,2.4,0)); scene.add(torus);
  const cv=document.createElement('canvas'); cv.width=300; cv.height=70;
  const ctx=cv.getContext('2d');
  ctx.fillStyle='rgba(0,0,0,0.55)'; ctx.beginPath(); ctx.roundRect(0,0,300,70,14); ctx.fill();
  ctx.fillStyle='#fff'; ctx.font='700 18px Space Grotesk'; ctx.textAlign='center'; ctx.fillText(d.name,150,30);
  ctx.fillStyle='#9CA3AF'; ctx.font='11px JetBrains Mono'; ctx.fillText('ENTER →',150,50);
  const tex=new THREE.CanvasTexture(cv); const spr=new THREE.Sprite(new THREE.SpriteMaterial({map:tex})); spr.position.copy(d.center).add(new THREE.Vector3(0,8,0)); spr.scale.set(12,2.8,1); scene.add(spr);
});
setProg(92);

// avatars — PBR capsules
function makeAvatar(hex, human=false){
  const g=new THREE.Group();
  const body=new THREE.Mesh(new THREE.CapsuleGeometry(0.33,0.68,4,12), new THREE.MeshStandardMaterial({color:hex, roughness:0.5, metalness:0.05}));
  body.position.y=0.88; body.castShadow=true; g.add(body);
  const head=new THREE.Mesh(new THREE.SphereGeometry(0.27,14,14), new THREE.MeshStandardMaterial({color: human?0xFDE68A:0xEDE9FE, roughness:0.4}));
  head.position.y=1.52; head.castShadow=true; g.add(head);
  if(!human){
    const ring=new THREE.Mesh(new THREE.RingGeometry(0.48,0.56,18), new THREE.MeshBasicMaterial({color:hex, side:THREE.DoubleSide, transparent:true, opacity:0.55}));
    ring.rotation.x=Math.PI/2; ring.position.y=2.02; g.add(ring);
  }
  return g;
}
const human=makeAvatar(0x3B82F6,true); human.position.set(0,0,7); scene.add(human);
const crowd=[], targets=[];
for(let i=0;i<42;i++){
  const col=[0x8B5CF6,0xEC4899,0x06B6D4,0x10B981,0xF59E0B][i%5];
  const a=makeAvatar(col,false);
  const ang=Math.random()*Math.PI*2, r=14+Math.random()*80;
  a.position.set(Math.cos(ang)*r,0,Math.sin(ang)*r); scene.add(a); crowd.push(a);
  targets.push(new THREE.Vector3((Math.random()-0.5)*100,0,(Math.random()-0.5)*100));
}
document.getElementById('aCount').textContent=crowd.length+1;
setProg(100);

// controls
const keys={}; addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true);
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
let sprint=false; addEventListener('keydown',e=>{if(e.key==='Shift') sprint=true}); addEventListener('keyup',e=>{if(e.key==='Shift') sprint=false});
function updateHuman(dt){
  const s=(sprint?6.5:3.4)*dt; let dx=0,dz=0;
  if(keys['w']) dz-=s; if(keys['s']) dz+=s; if(keys['a']) dx-=s; if(keys['d']) dx+=s;
  if(dx||dz){
    const fwd=new THREE.Vector3(); camera.getWorldDirection(fwd); fwd.y=0; fwd.normalize();
    const right=new THREE.Vector3().crossVectors(fwd,new THREE.Vector3(0,1,0)).negate();
    human.position.addScaledVector(fwd,-dz).addScaledVector(right,-dx);
    human.position.x=Math.max(-115,Math.min(115,human.position.x));
    human.position.z=Math.max(-115,Math.min(115,human.position.z));
    human.lookAt(human.position.x+dx,0,human.position.z+dz);
    controls.target.lerp(human.position,0.05);
  }
}
function updateCrowd(dt){
  crowd.forEach((a,i)=>{
    const t=targets[i]; const d=new THREE.Vector3().subVectors(t,a.position); d.y=0;
    if(d.length()<1.8) t.set((Math.random()-0.5)*110,0,(Math.random()-0.5)*110);
    else { d.normalize().multiplyScalar(1.15*dt); a.position.add(d); a.lookAt(t.x,0,t.z); }
    a.position.y=Math.sin(performance.now()*0.0014 + i)*0.03;
  });
}
window.gotoDistrict=i=>{
  document.querySelectorAll('#districts button').forEach((b,idx)=> b.classList.toggle('active', idx===i));
  const p=districts[i].center.clone(); p.y=0;
  human.position.copy(p).add(new THREE.Vector3(3,0,3)); controls.target.copy(human.position);
  camera.position.copy(human.position).add(new THREE.Vector3(20,18,20));
};
window.sendChat=()=>{
  const v=document.getElementById('msg').value.trim(); if(!v) return;
  document.getElementById('msg').value='';
  let best=crowd[0], bd=1e9; crowd.forEach(a=>{ const d=a.position.distanceTo(human.position); if(d<bd){bd=d; best=a;}});
  if(best) targets[crowd.indexOf(best)].copy(human.position).add(new THREE.Vector3((Math.random()-0.5)*3,0,(Math.random()-0.5)*3));
};

let last=performance.now(), frames=0, lastFps=performance.now();
function animate(){
  requestAnimationFrame(animate);
  const now=performance.now(), dt=Math.min(0.033,(now-last)/1000); last=now;
  updateHuman(dt); updateCrowd(dt);
  beaconL.intensity=120+Math.sin(now*0.0025)*25;
  districts.forEach((d,i)=>{
    const torus=scene.children.find(c=> c.isMesh && c.geometry.type==='TorusGeometry' && Math.abs(c.position.x-d.center.x)<0.1);
    if(torus) torus.rotation.y+=dt*0.6;
  });
  if(earthTiles) updateEarth(camera, renderer);
  controls.update(); composer.render();
  frames++; if(now-lastFps>500){ document.getElementById('fps').textContent=Math.round(frames*1000/(now-lastFps)); frames=0; lastFps=now; }
}
animate();
addEventListener('resize',()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); composer.setSize(innerWidth,innerHeight);});
</script>
</body>
</html>
