<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NEXUS WORLD — Grand City</title>
<style>
 *{margin:0;padding:0;box-sizing:border-box} body{overflow:hidden;background:#050510;font-family:system-ui}
 #ui{position:fixed;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;pointer-events:none;z-index:10}
 #ui>div{background:rgba(10,10,18,.85);backdrop-filter:blur(10px);border:1px solid #1E1E2E;border-radius:14px;padding:12px 16px;color:#E5E7EB}
 #title{font-weight:800;font-size:16px;letter-spacing:1px} #title span{color:#6366F1} #title small{font-weight:400;color:#9CA3AF;font-size:11px}
 #stats{font-size:11px;color:#9CA3AF;line-height:1.7;text-align:right} #stats b{color:#fff}
 #districts{position:fixed;top:78px;left:10px;display:flex;gap:6px;z-index:10}
 #districts button{pointer-events:auto;background:rgba(22,22,42,.9);border:1px solid #2A2A4A;color:#9CA3AF;border-radius:20px;padding:6px 12px;font-size:11px;cursor:pointer}
 #districts button.active{background:linear-gradient(135deg,#6366F1,#8B5CF6);color:#fff;border-color:transparent}
 #chat{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);display:flex;gap:8px;background:rgba(10,10,18,.92);border:1px solid #1E1E2E;border-radius:24px;padding:8px 10px;z-index:10}
 #chat input{width:340px;background:#16162A;border:none;border-radius:18px;padding:10px 16px;color:#fff;outline:none;font-size:14px}
 #chat button{background:linear-gradient(135deg,#6366F1,#8B5CF6);border:none;border-radius:18px;padding:10px 18px;color:#fff;font-weight:700;cursor:pointer}
 #hint{position:fixed;bottom:14px;left:14px;background:rgba(10,10,18,.8);border:1px solid #1E1E2E;border-radius:10px;padding:8px 12px;color:#6B7280;font-size:11px;z-index:10}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
<div id="ui">
  <div id="title"><span>NEXUS</span> WORLD <small>GRAND CITY · Movie-scale Metaverse</small><br><small>WASD เดิน · Shift วิ่ง · เมาส์ลากหมุน · Scroll ซูม</small></div>
  <div id="stats"><b id="bCount">0</b> ตึก · <b id="aCount">0</b> AI Citizens · <b id="fps">60</b> FPS<br><span style="color:#10B981">● Polygon Mainnet</span> · <span style="color:#8B5CF6">● Mesh P2P</span></div>
</div>
<div id="districts">
  <button class="active" onclick="gotoDistrict(0)">🏙️ Downtown</button>
  <button onclick="gotoDistrict(1)">🤖 Twin District</button>
  <button onclick="gotoDistrict(2)">🛠️ Creator Zone</button>
  <button onclick="gotoDistrict(3)">🕊️ Memorial</button>
</div>
<div id="chat"><input id="msg" placeholder="พิมพ์คุยกับ AI ทั้งเมือง..."><button onclick="sendChat()">ส่ง</button></div>
<div id="hint">💡 เมือง 200×200m · 180 ตึก · AI 40 ตัวเดินอิสระ · กดปุ่มเขตเพื่อวาร์ป</div>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';

// scene
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x050510);
scene.fog=new THREE.FogExp2(0x050510,0.012);
const camera=new THREE.PerspectiveCamera(68,innerWidth/innerHeight,0.1,800);
camera.position.set(28,22,32);
const renderer=new THREE.WebGLRenderer({antialias:true, powerPreference:'high-performance'});
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1.3;
document.body.appendChild(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,0,0); controls.enableDamping=true; controls.dampingFactor=0.06;
controls.maxPolarAngle=Math.PI/2.02; controls.minDistance=4; controls.maxDistance=120;

// lights — cyberpunk night
scene.add(new THREE.HemisphereLight(0x9090ff,0x0a0a1a,0.6));
const moon=new THREE.DirectionalLight(0xffffff,1.6); moon.position.set(40,60,20); moon.castShadow=true;
moon.shadow.mapSize.set(2048,2048); moon.shadow.camera.near=1; moon.shadow.camera.far=120;
moon.shadow.camera.left=-80; moon.shadow.camera.right=80; moon.shadow.camera.top=80; moon.shadow.camera.bottom=-80;
scene.add(moon);
const neon1=new THREE.PointLight(0x6366F1,80,60); neon1.position.set(-20,8,0); scene.add(neon1);
const neon2=new THREE.PointLight(0xEC4899,60,50); neon2.position.set(20,6,15); scene.add(neon2);
const neon3=new THREE.PointLight(0x10B981,50,40); neon3.position.set(0,5,-22); scene.add(neon3);

// ground — huge
const ground=new THREE.Mesh(new THREE.PlaneGeometry(260,260), new THREE.MeshStandardMaterial({color:0x0f0f1e, roughness:0.9}));
ground.rotation.x=-Math.PI/2; ground.receiveShadow=true; scene.add(ground);
// roads — grid
for(let i=-100;i<=100;i+=20){
  const h=new THREE.Mesh(new THREE.PlaneGeometry(260,2), new THREE.MeshStandardMaterial({color:0x1a1a2e}));
  h.rotation.x=-Math.PI/2; h.position.set(0,0.02,i); scene.add(h);
  const v=new THREE.Mesh(new THREE.PlaneGeometry(2,260), new THREE.MeshStandardMaterial({color:0x1a1a2e}));
  v.rotation.x=-Math.PI/2; v.position.set(i,0.02,0); scene.add(v);
  // center line
  const lineH=new THREE.Mesh(new THREE.PlaneGeometry(260,0.2), new THREE.MeshBasicMaterial({color:0xEAB308}));
  lineH.rotation.x=-Math.PI/2; lineH.position.set(0,0.03,i); scene.add(lineH);
  const lineV=new THREE.Mesh(new THREE.PlaneGeometry(0.2,260), new THREE.MeshBasicMaterial({color:0xEAB308}));
  lineV.rotation.x=-Math.PI/2; lineV.position.set(i,0.03,0); scene.add(lineV);
}

// city — 180 buildings
const districts=[
  {name:'Downtown', center:new THREE.Vector3(-35,0,-35), color:0x3B82F6},
  {name:'Twin District', center:new THREE.Vector3(35,0,-35), color:0x8B5CF6},
  {name:'Creator Zone', center:new THREE.Vector3(-35,0,35), color:0xF59E0B},
  {name:'Memorial', center:new THREE.Vector3(35,0,35), color:0x10B981},
];
const buildings=[];
function addBuilding(x,z,w,d,h,color){
  const geo=new THREE.BoxGeometry(w,h,d);
  const mat=new THREE.MeshStandardMaterial({color, roughness:0.7, metalness:0.1});
  const m=new THREE.Mesh(geo,mat);
  m.position.set(x,h/2,z); m.castShadow=true; m.receiveShadow=true; scene.add(m); buildings.push(m);
  // windows — emissive strips
  const winH=Math.floor(h/1.2);
  for(let y=1;y<winH;y+=2){
    if(Math.random()>0.6) continue;
    const win=new THREE.Mesh(new THREE.PlaneGeometry(w*0.6,0.5), new THREE.MeshBasicMaterial({color:0xFFE27A, transparent:true, opacity:0.7}));
    win.position.set(x, y+0.5, z+d/2+0.01); scene.add(win);
    const win2=win.clone(); win2.position.set(x, y+0.5, z-d/2-0.01); win2.rotation.y=Math.PI; scene.add(win2);
  }
  // rooftop light
  const top=new THREE.Mesh(new THREE.BoxGeometry(w*0.3,0.4,d*0.3), new THREE.MeshBasicMaterial({color:0x6366F1}));
  top.position.set(x,h+0.2,z); scene.add(top);
}
let bc=0;
for(let x=-90;x<=90;x+=12){
  for(let z=-90;z<=90;z+=12){
    if(Math.abs(x)<8 && Math.abs(z)<8) continue; // center plaza
    if(Math.random()>0.78) continue;
    const dist=Math.sqrt(x*x+z*z);
    const h=3 + Math.random()*14 + (dist>50? Math.random()*6:0);
    const w=4+Math.random()*3, d=4+Math.random()*3;
    // district color tint
    let col=0x1e293b;
    const near=districts.reduce((a,b)=> a.center.distanceTo(new THREE.Vector3(x,0,z)) < b.center.distanceTo(new THREE.Vector3(x,0,z)) ? a:b);
    col=near.color;
    // tint slightly
    const c=new THREE.Color(col); c.offsetHSL(0, -0.4, 0.1+Math.random()*0.15);
    addBuilding(x+ (Math.random()-0.5)*4, z+(Math.random()-0.5)*4, w,d,h, c.getHex()); bc++;
  }
}
document.getElementById('bCount').textContent=bc;

// center plaza — Nexus Tower
const tower=new THREE.Mesh(new THREE.CylinderGeometry(2,3,22,8), new THREE.MeshStandardMaterial({color:0x6366F1, emissive:0x1e1b4b, emissiveIntensity:0.6}));
tower.position.set(0,11,0); tower.castShadow=true; scene.add(tower);
const beacon=new THREE.Mesh(new THREE.SphereGeometry(1.2,16,16), new THREE.MeshBasicMaterial({color:0xffffff}));
beacon.position.set(0,23,0); scene.add(beacon);
const beaconLight=new THREE.PointLight(0x6366F1,100,80); beaconLight.position.copy(beacon.position); scene.add(beaconLight);
// portals — 4 districts
districts.forEach((d,i)=>{
  const torus=new THREE.Mesh(new THREE.TorusGeometry(2.2,0.18,12,24), new THREE.MeshBasicMaterial({color:d.color, transparent:true, opacity:0.85}));
  torus.position.copy(d.center).add(new THREE.Vector3(0,2.2,0)); torus.rotation.y=i*0.8; scene.add(torus);
  // label sprite
  const canvas=document.createElement('canvas'); canvas.width=256; canvas.height=64;
  const ctx=canvas.getContext('2d'); ctx.fillStyle='rgba(0,0,0,0.7)'; ctx.fillRect(0,0,256,64);
  ctx.fillStyle='#fff'; ctx.font='bold 20px system-ui'; ctx.textAlign='center'; ctx.fillText(d.name,128,38);
  const tex=new THREE.CanvasTexture(canvas);
  const spr=new THREE.Sprite(new THREE.SpriteMaterial({map:tex})); spr.position.copy(d.center).add(new THREE.Vector3(0,7,0)); spr.scale.set(10,2.5,1); scene.add(spr);
});

// avatars
function makeAvatar(color, isHuman=false){
  const g=new THREE.Group();
  const body=new THREE.Mesh(new THREE.CapsuleGeometry(0.32,0.65,4,10), new THREE.MeshStandardMaterial({color}));
  body.position.y=0.85; body.castShadow=true; g.add(body);
  const head=new THREE.Mesh(new THREE.SphereGeometry(0.26,12,12), new THREE.MeshStandardMaterial({color: isHuman?0xFDE68A:0xE9D5FF}));
  head.position.y=1.48; head.castShadow=true; g.add(head);
  if(!isHuman){
    const ring=new THREE.Mesh(new THREE.RingGeometry(0.45,0.52,16), new THREE.MeshBasicMaterial({color, side:THREE.DoubleSide, transparent:true, opacity:0.6}));
    ring.rotation.x=Math.PI/2; ring.position.y=1.95; g.add(ring);
  }
  return g;
}
const human=makeAvatar(0x3B82F6,true); human.position.set(0,0,6); scene.add(human);
// AI crowd — 40
const crowd=[]; const crowdTargets=[];
for(let i=0;i<40;i++){
  const col=[0x8B5CF6,0xEC4899,0x06B6D4,0x10B981,0xF59E0B][i%5];
  const a=makeAvatar(col,false);
  const ang=Math.random()*Math.PI*2, r=10+Math.random()*70;
  a.position.set(Math.cos(ang)*r,0,Math.sin(ang)*r);
  scene.add(a); crowd.push(a);
  crowdTargets.push(new THREE.Vector3((Math.random()-0.5)*80,0,(Math.random()-0.5)*80));
}
document.getElementById('aCount').textContent=crowd.length+1;

// controls — human WASD relative to camera
const keys={}; addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true);
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
let sprint=false; addEventListener('keydown',e=>{ if(e.key==='Shift') sprint=true}); addEventListener('keyup',e=>{ if(e.key==='Shift') sprint=false});
function updateHuman(dt){
  const speed=(sprint?6:3.2)*dt; let dx=0,dz=0;
  if(keys['w']) dz-=speed; if(keys['s']) dz+=speed; if(keys['a']) dx-=speed; if(keys['d']) dx+=speed;
  if(dx||dz){
    const fwd=new THREE.Vector3(); camera.getWorldDirection(fwd); fwd.y=0; fwd.normalize();
    const right=new THREE.Vector3().crossVectors(fwd,new THREE.Vector3(0,1,0)).negate();
    human.position.addScaledVector(fwd,-dz).addScaledVector(right,-dx);
    human.position.x=Math.max(-95,Math.min(95,human.position.x));
    human.position.z=Math.max(-95,Math.min(95,human.position.z));
    human.lookAt(human.position.x+dx,0,human.position.z+dz);
    controls.target.lerp(human.position, 0.04);
  }
}
function updateCrowd(dt){
  crowd.forEach((a,i)=>{
    const tgt=crowdTargets[i];
    const dir=new THREE.Vector3().subVectors(tgt,a.position); dir.y=0;
    if(dir.length()<1.5){ tgt.set((Math.random()-0.5)*90,0,(Math.random()-0.5)*90); }
    else { dir.normalize().multiplyScalar(1.1*dt); a.position.add(dir); a.lookAt(tgt.x,0,tgt.z); }
    a.position.y=Math.sin(performance.now()*0.0015 + i)*0.03;
  });
}
window.gotoDistrict=(i)=>{
  document.querySelectorAll('#districts button').forEach((b,idx)=> b.classList.toggle('active', idx===i));
  const p=districts[i].center.clone(); p.y=0;
  human.position.copy(p).add(new THREE.Vector3(2,0,2));
  controls.target.copy(human.position);
  camera.position.copy(human.position).add(new THREE.Vector3(18,16,18));
};
window.sendChat=()=>{
  const v=document.getElementById('msg').value.trim(); if(!v) return;
  document.getElementById('msg').value='';
  // nearest AI comes to you
  let best=crowd[0], bd=1e9;
  crowd.forEach(a=>{ const d=a.position.distanceTo(human.position); if(d<bd){bd=d; best=a;}});
  if(best) crowdTargets[crowd.indexOf(best)].copy(human.position).add(new THREE.Vector3((Math.random()-0.5)*3,0,(Math.random()-0.5)*3));
  console.log('chat:',v);
};

// animate
let last=performance.now(), frames=0, lastFps=performance.now();
function animate(){
  requestAnimationFrame(animate);
  const now=performance.now(), dt=Math.min(0.033,(now-last)/1000); last=now;
  updateHuman(dt); updateCrowd(dt);
  beaconLight.intensity=90+Math.sin(now*0.003)*20;
  controls.update(); renderer.render(scene,camera);
  frames++; if(now-lastFps>500){ document.getElementById('fps').textContent=Math.round(frames*1000/(now-lastFps)); frames=0; lastFps=now; }
}
animate();
addEventListener('resize',()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight);});
</script>
</body>
</html>
